<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUAM · Administración</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, sans-serif; color: #162033; background: #eef3fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(420px, 100%); background: #fff; border: 1px solid #dfe6ef; border-radius: 18px; padding: 32px; box-shadow: 0 18px 50px rgba(27,45,78,.12); }
    h1 { margin: 8px 0 6px; font-size: 26px; }
    p { margin: 0 0 24px; color: #667085; }
    label { display: block; margin: 14px 0 7px; font-weight: 700; }
    input { width: 100%; height: 46px; border: 1px solid #cbd5e1; border-radius: 9px; padding: 0 12px; font-size: 15px; }
    button { width: 100%; height: 46px; margin-top: 18px; border: 0; border-radius: 9px; background: #3157d5; color: #fff; font-weight: 800; cursor: pointer; }
    .error { margin: 16px 0 0; padding: 10px 12px; border-radius: 8px; background: #fff1f2; color: #9f1239; }
    .brand { color: #3157d5; font-weight: 900; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <div class="brand">NUAM</div>
    <h1>Administración</h1>
    <p>Accede con una cuenta administradora.</p>
    <form method="post">
      {% csrf_token %}
      <label for="username">Usuario o correo</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Iniciar sesión</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </main>
</body>
</html>
